<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WorkPulse</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="pb-12">

    <nav class="m-nav">
        <div class="max-w-4xl mx-auto px-4 py-3 grid grid-cols-3 items-center">
            <div class="flex items-center gap-2">
                <div class="m-brand-chip">W</div>
                <h1 class="m-app-title hidden sm:block">WorkPulse</h1>
            </div>
            <div id="current-date" class="m-date text-center whitespace-nowrap">--:--:--</div>
            <div class="flex items-center justify-end gap-1">
                <button id="reset-btn" disabled class="m-icon-btn" aria-label="Reset session">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                </button>
                <button id="export-btn" disabled class="m-icon-btn m-icon-btn--filled" aria-label="Export CSV">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
                </button>
            </div>
        </div>
    </nav>

    <main class="w-full max-w-xl mx-auto px-4 space-y-8 pt-8">

        <section class="m-card p-6">
            <h2 class="m-heading mb-6 text-center">Shift Duration</h2>
            <div class="grid grid-cols-2 gap-6">
                <div class="text-center">
                    <label class="m-label" for="in-time">Clock In</label>
                    <input type="text" inputmode="numeric" id="in-time" placeholder="--:--" autocomplete="off" class="m-field m-field--lg">
                </div>
                <div class="text-center">
                    <label class="m-label" for="out-time">Clock Out</label>
                    <input type="text" inputmode="numeric" id="out-time" placeholder="--:--" autocomplete="off" class="m-field m-field--lg">
                </div>
            </div>
        </section>

        <section class="m-card p-6 space-y-4">
            <h2 class="m-heading text-center">Breaks</h2>
            <div class="hidden sm:grid grid-cols-[1fr_1fr_1fr_44px] gap-3 px-4 text-center">
                <span class="m-label m-label--flush">Start Time</span>
                <span class="m-label m-label--flush">End Time</span>
                <span class="m-label m-label--flush">Total</span>
                <span></span>
            </div>
            <div id="breaks-container" class="space-y-3"></div>
            <div class="flex justify-center pt-2">
                <button id="add-break-btn" class="m-icon-btn m-icon-btn--tonal" aria-label="Add break">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 4v16m8-8H4" stroke-width="2.5" stroke-linecap="round"/></svg>
                </button>
            </div>
        </section>

        <section class="m-card p-6 space-y-6">
            <h2 class="m-heading text-center">Duration Calculation</h2>
            <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
                <div class="flex-1 m-metric text-center">
                    <p class="m-metric__label mb-1">Gross</p>
                    <p id="gross-output" class="m-metric__value">0h 0m</p>
                </div>
                <div class="m-op">−</div>
                <div class="flex-1 m-metric text-center">
                    <p class="m-metric__label mb-1">Total Breaks</p>
                    <p id="total-break-display" class="m-metric__value m-metric__value--accent">0m</p>
                </div>
                <div class="m-op">=</div>
                <div id="net-card-container" class="flex-1 m-metric m-metric--primary text-center">
                    <p class="m-metric__label mb-1">Net Work</p>
                    <p id="net-output" class="m-metric__value">0h 0m</p>
                </div>
            </div>
            <p id="error-output" class="m-error"></p>
        </section>
    </main>

    <script src="logic.js"></script>
    <script src="controller.js"></script>
</body>
</html>
